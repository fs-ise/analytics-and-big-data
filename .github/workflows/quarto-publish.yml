name: Quarto Publish

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "quarto-publish"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Quarto
      # Note: v2 is the current major for quarto-dev actions
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false    # set true if you render PDFs needing LaTeX

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install decktape
        run: |
          npm install -g decktape

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'

      - name: Install Python deps with uv
        run: |
          uv sync

      - name: Register Jupyter kernel
        run: |
          uv run python -m ipykernel install --user --name quarto-env --display-name "Python (quarto-env)"

      - name: Render site
        run: |
          uv run make all

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
